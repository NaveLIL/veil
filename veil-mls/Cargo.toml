[package]
name = "veil-mls"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "OpenMLS (RFC 9420) wrapper for Veil — Phase 6 group E2EE."

[dependencies]
# OpenMLS — single cipher suite: MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519.
openmls = { version = "0.9", default-features = false }
openmls_rust_crypto = "0.6"
openmls_traits = "0.6"
openmls_basic_credential = "0.6"
openmls_memory_storage = "0.6"

# Encoded payloads on the wire are TLS-serialized opaque blobs. Text encoding
# belongs to the transport boundary, not the cryptographic crate.
serde = { version = "1", features = ["derive"] }
hex = "0.4"
thiserror = "2"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
# multi-client roundtrip tests
