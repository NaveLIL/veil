apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
// RN 0.79's application plugin aligns toolchains across ALL projects. :app
// has already aligned this module to JDK 17; a second alignment finalizes an
// already finalized Kotlin languageVersion. Skip only that duplicate pass.
ext.set('react.internal.disableJavaVersionAlignment', true)
apply plugin: 'com.facebook.react'

def projectRoot = rootDir.parentFile.absolutePath
react {
    root = file('../..')
    entryFile = file('../../design-preview-index.ts')
    reactNativeDir = new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).parentFile
    codegenDir = new File(['node', '--print', "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).parentFile
    hermesCommand = reactNativeDir.get().asFile.absolutePath + '/sdks/hermesc/%OS-BIN%/hermesc'
    cliFile = new File(['node', '--print', "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = 'export:embed'
    // Deliberately do not autolink the account application's full dependency
    // set: Expo would pull camera, secure-store, scanners and other modules.
}
def previewLinkFile = layout.buildDirectory.file('generated/preview-autolinking/autolinking.json')
def rootLinkFile = rootProject.layout.buildDirectory.file('generated/autolinking/autolinking.json')
def previewLibraries = ['react-native-safe-area-context', 'react-native-svg', 'react-native-edge-to-edge']
def preparePreviewAutolinking = tasks.register('preparePreviewAutolinking') {
    inputs.file(rootLinkFile)
    outputs.file(previewLinkFile)
    doLast {
        def config = new groovy.json.JsonSlurper().parse(rootLinkFile.get().asFile)
        config.dependencies = config.dependencies.findAll { name, value -> previewLibraries.contains(name) }
        if (config.dependencies.keySet() != previewLibraries.toSet()) {
            throw new GradleException('Preview native UI dependency inventory changed')
        }
        def output = previewLinkFile.get().asFile
        output.parentFile.mkdirs()
        output.setText(groovy.json.JsonOutput.toJson(config), 'UTF-8')
    }
}
['generateAutolinkingPackageList', 'generateAutolinkingNewArchitectureFiles'].each { name ->
    tasks.named(name) {
        dependsOn(preparePreviewAutolinking)
        autolinkInputFile.set(previewLinkFile)
    }
}
def signingNames = ['VEIL_ANDROID_TESTER_KEYSTORE', 'VEIL_ANDROID_TESTER_KEYSTORE_PASSWORD', 'VEIL_ANDROID_TESTER_KEY_ALIAS', 'VEIL_ANDROID_TESTER_KEY_PASSWORD']
def signing = signingNames.collect { System.getenv(it) }
def signingReady = signing.every { it != null && !it.trim().empty }
def sourceCommit = System.getenv('VEIL_SOURCE_COMMIT') ?: 'unconfigured'

android {
    namespace 'io.veil.mobile.designpreview'
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion
    defaultConfig {
        applicationId 'io.veil.mobile.designpreview'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2026100401
        versionName '0.1.0-design.20261004.1'
        manifestPlaceholders = [veilDesignSource: sourceCommit]
    }
    signingConfigs {
        if (signingReady) {
            preview {
                storeFile file(signing[0]); storePassword signing[1]
                keyAlias signing[2]; keyPassword signing[3]
                enableV1Signing = false; enableV2Signing = true
                enableV3Signing = false; enableV4Signing = false
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            if (signingReady) signingConfig signingConfigs.preview
        }
    }
    compileOptions { coreLibraryDesugaringEnabled true }
}
dependencies {
    coreLibraryDesugaring('com.android.tools:desugar_jdk_libs:2.1.5')
    implementation('com.facebook.react:react-android')
    implementation('com.facebook.react:hermes-android')
    previewLibraries.each { implementation project(":${it}") }
}
gradle.taskGraph.whenReady { graph ->
    def tasks = graph.allTasks.findAll { it.project == project }
    if (tasks.any { it.name ==~ /(?i)^(install|uninstall|connected).*/ }) {
        throw new GradleException('Preview build is host-only. Use assembleRelease and install the reviewed APK manually; never erase an account app.')
    }
    if (tasks.any { it.name.toLowerCase().contains('release') } && (!signingReady || !(sourceCommit ==~ /^[0-9a-f]{40}$/))) {
        throw new GradleException('Design APK requires complete independent tester signing and a source commit. No unsigned/debug fallback.')
    }
}
