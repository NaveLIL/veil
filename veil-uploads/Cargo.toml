[package]
name = "veil-uploads"
version = "0.1.0"
edition = "2021"
authors.workspace = true
description = "Resumable encrypted uploads for Veil messenger (tus.io client + chunked AEAD streaming)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
veil-crypto = { path = "../veil-crypto" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros", "sync"] }
bytes = "1"
base64 = "0.22"
rand = "0.8"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
sha2 = "0.10"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
