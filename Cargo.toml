[workspace]
members = [
    "veil-crypto",
    "veil-store",
    "veil-client",
    "veil-ffi",
    "veil-desktop/src-tauri",
    "veil-share-viewer",
    "veil-search",
    "veil-uploads",
    "veil-mls",
]
exclude = [
    "third_party/openmls_rust_crypto-0.4.4",
    "third_party/wayland-scanner-0.31.10",
]
resolver = "2"

[workspace.package]
authors = ["NaveLIL"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/NaveLIL/veil"
homepage = "https://veil.erez.pro"
publish = false

[patch.crates-io]
# The published OpenMLS 0.7 provider pins hpke-rs 0.6, whose lock graph keeps
# vulnerable libcrux 0.0.x crates. Upstream fixed the graph by moving the three
# HPKE crates to 0.7 without changing provider code. Keep that dependency-only
# backport local until crates.io publishes a compatible provider release.
# See third_party/openmls_rust_crypto-0.4.4/UPSTREAM.md.
openmls_rust_crypto = { path = "third_party/openmls_rust_crypto-0.4.4" }

# wayland-scanner 0.31.10 pins quick-xml 0.39, which is affected by
# RUSTSEC-2026-0194 and RUSTSEC-2026-0195. The vendored crates.io source keeps
# the released scanner API and applies only upstream's dependency-only 0.41
# security bump. See third_party/wayland-scanner-0.31.10/UPSTREAM.md.
wayland-scanner = { path = "third_party/wayland-scanner-0.31.10" }

[profile.release.package.veil-share-viewer]
opt-level = "s"
