[workspace]
members = [
    "veil-crypto",
    "veil-store",
    "veil-client",
    "veil-ffi",
    "veil-desktop/src-tauri",
    "veil-share-viewer",
    "veil-search",
    "veil-uploads",
    "veil-mls",
]
exclude = [
    "third_party/lru-0.16.4",
    "third_party/wayland-scanner-0.31.10",
]
resolver = "2"

[workspace.package]
authors = ["NaveLIL"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/NaveLIL/veil"
homepage = "https://veil.erez.pro"
publish = false

[patch.crates-io]
# Tantivy 0.26 pins lru 0.16, while the upstream panic-safety fix is only
# published in lru 0.18.2. Keep the released 0.16.4 API with upstream's exact
# detach-before-drop fix until Tantivy accepts the maintained lru line.
# See third_party/lru-0.16.4/UPSTREAM.md.
lru = { path = "third_party/lru-0.16.4" }

# wayland-scanner 0.31.10 pins quick-xml 0.39, which is affected by
# RUSTSEC-2026-0194 and RUSTSEC-2026-0195. The vendored crates.io source keeps
# the released scanner API and applies only upstream's dependency-only 0.41
# security bump. See third_party/wayland-scanner-0.31.10/UPSTREAM.md.
wayland-scanner = { path = "third_party/wayland-scanner-0.31.10" }

[profile.release.package.veil-share-viewer]
opt-level = "s"
