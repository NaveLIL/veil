services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: veil
      POSTGRES_USER: veil
      POSTGRES_PASSWORD: "${VEIL_DB_PASSWORD:?set VEIL_DB_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veil -d veil"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: postgres:18-alpine
    restart: "no"
    environment:
      DATABASE_URL: "postgres://veil:${VEIL_DB_PASSWORD:?set VEIL_DB_PASSWORD in .env}@postgres:5432/veil?sslmode=disable"
    volumes:
      - ./veil-server/migrations:/migrations:ro
      - ./scripts/apply-migrations.sh:/usr/local/bin/apply-migrations:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/apply-migrations"]
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: veil-server/Dockerfile
      args:
        VEIL_BUILD_COMMIT: "${VEIL_BUILD_COMMIT:-development}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:9080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://veil:${VEIL_DB_PASSWORD:?set VEIL_DB_PASSWORD in .env}@postgres:5432/veil?sslmode=disable"
      VEIL_PUBLIC_ORIGIN:       "${VEIL_PUBLIC_ORIGIN:?set VEIL_PUBLIC_ORIGIN in .env to the exact client-visible origin with an explicit port}"
      VEIL_WS_ORIGINS:           "${VEIL_WS_ORIGINS:?set VEIL_WS_ORIGINS in .env}"
      VEIL_CORS_ORIGINS:         "${VEIL_CORS_ORIGINS:-}"
      VEIL_WS_MAX_CONNS_PER_IP:  "${VEIL_WS_MAX_CONNS_PER_IP:-64}"
      VEIL_ALLOW_REGISTRATION:    "${VEIL_ALLOW_REGISTRATION:-true}"
      VEIL_SOURCE_REVISION:      "${VEIL_SOURCE_REVISION:-}"
      VEIL_SOURCE_ARCHIVE_URL:   "${VEIL_SOURCE_ARCHIVE_URL:-}"
      VEIL_SOURCE_BROWSE_URL:    "${VEIL_SOURCE_BROWSE_URL:-}"
      # Compose traffic may arrive through the bundled Caddy proxy. Outside
      # this topology the application default remains false/fail-closed.
      VEIL_TRUST_PROXY_HEADERS:  "${VEIL_TRUST_PROXY_HEADERS:-true}"
      # Phase 4P — RFC 8291 Web Push + VAPID. Generate the private key with:
      #   cd veil-server && go run ./cmd/vapid-keygen
      # Registration and delivery fail closed while either value is absent.
      VEIL_PUSH_VAPID_PRIVATE_KEY: "${VEIL_PUSH_VAPID_PRIVATE_KEY:-}"
      VEIL_PUSH_VAPID_SUBJECT:     "${VEIL_PUSH_VAPID_SUBJECT:-}"
      VEIL_PUSH_JITTER_MS:     "${VEIL_PUSH_JITTER_MS:-2000}"
      # Exact private origin only; paths under ntfy are allowed, neighboring
      # containers/private IPs remain blocked by the SSRF policy.
      VEIL_PUSH_ALLOWED_PRIVATE_ORIGINS: "${VEIL_PUSH_ALLOWED_PRIVATE_ORIGINS:-http://ntfy:80}"
      # Phase 3 — tus.io resumable encrypted uploads. Generate the
      # bearer-token HMAC key with:
      #   openssl rand -base64 32
      # Leaving VEIL_UPLOAD_TOKEN_KEY empty disables uploads.
      VEIL_UPLOAD_TOKEN_KEY:           "${VEIL_UPLOAD_TOKEN_KEY:-}"
      UPLOAD_LOCAL_DIR:                "/var/veil/uploads"
      UPLOAD_MAX_BYTES:                "${UPLOAD_MAX_BYTES:-1073741824}"
      UPLOAD_USER_DAILY_QUOTA_BYTES:   "${UPLOAD_USER_DAILY_QUOTA_BYTES:-5368709120}"
      UPLOAD_QUOTA_WINDOW:             "${UPLOAD_QUOTA_WINDOW:-24h}"
      UPLOAD_RETENTION:                "${UPLOAD_RETENTION:-720h}"
      UPLOAD_ABORT_TTL:                "${UPLOAD_ABORT_TTL:-24h}"
      UPLOAD_SWEEP_INTERVAL:           "${UPLOAD_SWEEP_INTERVAL:-1h}"
      UPLOAD_TOKEN_TTL:                "${UPLOAD_TOKEN_TTL:-24h}"
    volumes:
      - uploadsdata:/var/veil/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Self-hosted UnifiedPush distributor. Mobile clients can register
  # against http://<your-host>:9081/<up-topic> and the gateway POSTs RFC 8291
  # encrypted Web Push records there. Operators who prefer ntfy.sh can drop
  # this service and point clients at the public instance.
  ntfy:
    image: binwiederhier/ntfy:v2.23.0
    restart: unless-stopped
    command: serve
    ports:
      - "127.0.0.1:9081:80"
    environment:
      NTFY_BASE_URL: "http://localhost:9081"
      NTFY_BEHIND_PROXY: "false"
      NTFY_AUTH_FILE: "/var/lib/ntfy/user.db"
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
      # UnifiedPush endpoints are random bearer capabilities under up*.
      # Other ntfy topics remain private/denied.
      NTFY_AUTH_ACCESS: "*:up*:rw"
      NTFY_CACHE_FILE: "/var/lib/ntfy/cache.db"
      NTFY_ATTACHMENT_CACHE_DIR: "/var/lib/ntfy/attachments"
    volumes:
      - ntfydata:/var/lib/ntfy

  # Опциональный reverse-proxy для публичного домена с автоматическим
  # TLS (Let's Encrypt). Включается через профиль:
  #   VEIL_PUBLIC_HOST=veil.erez.pro VEIL_TLS_EMAIL=admin@example.com \
  #     docker compose --profile proxy up -d
  # Без VEIL_PUBLIC_HOST смысла поднимать нет — gateway уже доступен
  # на :9080 для локальной разработки.
  caddy:
    image: caddy:2.8-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      VEIL_PUBLIC_HOST: "${VEIL_PUBLIC_HOST:-}"
      VEIL_TLS_EMAIL:   "${VEIL_TLS_EMAIL:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  pgdata:
  ntfydata:
  uploadsdata:
  caddydata:
  caddyconfig:
