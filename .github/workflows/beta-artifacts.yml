name: Beta Artifacts

on:
  push:
    branches: ["ds/beta-all-2026-07-21"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VITE_VEIL_WS_URL: wss://veil.erez.pro/ws
  VITE_VEIL_HTTP_URL: https://veil.erez.pro
  VEIL_PROJECT_SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
  VEIL_RELEASE_PUBLISHER: NaveLIL

jobs:
  guard:
    name: Guard integration ref
    runs-on: ubuntu-latest
    steps:
      - name: Require the beta integration branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/ds/beta-all-2026-07-21" ]]; then
            echo "Beta artifacts may only be built from ds/beta-all-2026-07-21" >&2
            exit 1
          fi

  linux-desktop:
    name: Linux desktop (.deb + AppImage)
    needs: guard
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev \
            libsecret-1-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            librsvg2-dev patchelf pkg-config wget

      - name: Set up Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Rust license collector
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: veil-desktop/pnpm-lock.yaml

      - name: Install locked renderer dependencies
        working-directory: veil-desktop
        run: pnpm install --frozen-lockfile

      - name: Build Linux desktop packages
        working-directory: veil-desktop
        run: pnpm tauri build --ci --bundles "deb,appimage"

      - name: Collect and verify Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t debs < <(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print)
          mapfile -t appimages < <(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print)
          [[ ${#debs[@]} -eq 1 ]] || { echo "Expected one .deb, found ${#debs[@]}" >&2; exit 1; }
          [[ ${#appimages[@]} -eq 1 ]] || { echo "Expected one AppImage, found ${#appimages[@]}" >&2; exit 1; }
          file -b "${appimages[0]}" | grep -Eq 'ELF 64-bit.*x86-64'
          test -s veil-desktop/src-tauri/resources/THIRD_PARTY_NOTICES.txt
          install -D -m 0644 "${debs[0]}" beta-assets/Veil-beta-linux-amd64.deb
          install -D -m 0755 "${appimages[0]}" beta-assets/Veil-beta-linux-x86_64.AppImage
          install -D -m 0644 veil-desktop/src-tauri/resources/THIRD_PARTY_NOTICES.txt \
            beta-assets/Veil-beta-linux-THIRD_PARTY_NOTICES.txt

      - name: Upload Linux beta artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veil-beta-linux-${{ github.sha }}
          path: beta-assets/
          if-no-files-found: error
          retention-days: 14

  windows-desktop:
    name: Windows desktop (NSIS + MSI)
    needs: guard
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Rust license collector
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: veil-desktop/pnpm-lock.yaml

      - name: Install locked renderer dependencies
        working-directory: veil-desktop
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Windows desktop packages
        working-directory: veil-desktop
        run: pnpm tauri build --ci --bundles "nsis,msi"

      - name: Collect and verify Windows artifacts
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $env:CARGO_TARGET_DIR "release\bundle"
          $nsis = @(Get-ChildItem (Join-Path $bundleRoot "nsis") -Filter *.exe -File)
          $msi = @(Get-ChildItem (Join-Path $bundleRoot "msi") -Filter *.msi -File)
          if ($nsis.Count -ne 1) { throw "Expected one NSIS installer, found $($nsis.Count)" }
          if ($msi.Count -ne 1) { throw "Expected one MSI installer, found $($msi.Count)" }
          foreach ($artifact in @($nsis[0], $msi[0])) {
            if ($artifact.Length -le 0) { throw "Empty artifact: $($artifact.FullName)" }
            $status = (Get-AuthenticodeSignature -LiteralPath $artifact.FullName).Status
            if ($status -ne "NotSigned") { throw "Unexpected beta signature state for $($artifact.Name): $status" }
          }
          New-Item -ItemType Directory -Path beta-assets -Force | Out-Null
          Copy-Item -LiteralPath $nsis[0].FullName -Destination beta-assets\Veil-beta-windows-x64-setup.exe
          Copy-Item -LiteralPath $msi[0].FullName -Destination beta-assets\Veil-beta-windows-x64.msi
          Copy-Item -LiteralPath veil-desktop\src-tauri\resources\THIRD_PARTY_NOTICES.txt `
            -Destination beta-assets\Veil-beta-windows-THIRD_PARTY_NOTICES.txt

      - name: Upload Windows beta artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veil-beta-windows-${{ github.sha }}
          path: beta-assets/
          if-no-files-found: error
          retention-days: 14

  gateway-oci:
    name: Gateway multi-architecture OCI image
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build OCI archive without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: veil-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: veil-gateway:beta-${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/veil-gateway-beta.oci.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: VEIL_BUILD_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Verify both OCI platforms
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
          archive="${RUNNER_TEMP}/veil-gateway-beta.oci.tar"
          test -s "$archive"
          raw="$(skopeo inspect --raw "oci-archive:$archive")"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | index("amd64") != null' <<< "$raw"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | index("arm64") != null' <<< "$raw"

      - name: Upload gateway OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veil-beta-gateway-oci-${{ github.sha }}
          path: ${{ runner.temp }}/veil-gateway-beta.oci.tar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  share-viewer:
    name: Deployable Share Viewer WASM
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build and bind the viewer
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p veil-share-viewer --target wasm32-unknown-unknown --release
          bindgen_version="$(cargo metadata --locked --format-version 1 | jq -r \
            '[.packages[] | select(.name == "wasm-bindgen") | .version] | unique | if length == 1 then .[0] else error("ambiguous wasm-bindgen version") end')"
          cargo install wasm-bindgen-cli --version "$bindgen_version" --locked
          install -d beta-assets/share-viewer/pkg
          wasm-bindgen target/wasm32-unknown-unknown/release/veil_share_viewer.wasm \
            --target web --out-dir beta-assets/share-viewer/pkg --out-name veil_share_viewer
          install -m 0644 veil-share-viewer/static/index.html beta-assets/share-viewer/index.html
          install -m 0644 LICENSE NOTICE THIRD_PARTY_NOTICES.md TRADEMARKS.md beta-assets/share-viewer/
          printf '%s\n' "$GITHUB_SHA" > beta-assets/share-viewer/SOURCE_COMMIT
          test -s beta-assets/share-viewer/pkg/veil_share_viewer.js
          test -s beta-assets/share-viewer/pkg/veil_share_viewer_bg.wasm

      - name: Upload Share Viewer beta artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veil-beta-share-viewer-${{ github.sha }}
          path: beta-assets/share-viewer/
          if-no-files-found: error
          retention-days: 14
