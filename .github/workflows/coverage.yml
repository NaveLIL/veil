name: Coverage

on:
  push:
    branches: [master, main, "ds/beta-all-2026-07-21"]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Coverage is informational — never blocks merge
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --version 0.37.0 --locked

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: coverage-${{ hashFiles('**/Cargo.toml') }}

      - name: Generate coverage
        run: |
          mkdir -p coverage
          cargo tarpaulin \
            --workspace \
            --exclude veil-desktop \
            --exclude veil-share-viewer \
            --exclude veil-ffi \
            --exclude-files "*/tests/*" \
            --exclude-files "*/benches/*" \
            --out xml \
            --out html \
            --output-dir coverage/ \
            --timeout 600 \
            --skip-clean \
            2>&1 | tee coverage/tarpaulin.log
          SUMMARY=$(grep -E "^[0-9]+\.[0-9]+% coverage" coverage/tarpaulin.log || echo "Coverage data unavailable")
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "\`$SUMMARY\`" >> $GITHUB_STEP_SUMMARY
          echo "See uploaded artifact for full HTML report." >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
