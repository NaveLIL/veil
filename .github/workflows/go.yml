name: Go CI

on:
  push:
    branches: [master, main]
    paths:
      - "veil-server/**"
      - "deploy/**"
      - "scripts/apply-migrations.sh"
      - "docker-compose.yml"
      - "Caddyfile"
      - ".env.example"
      - ".github/workflows/go.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "veil-server/**"
      - "deploy/**"
      - "scripts/apply-migrations.sh"
      - "docker-compose.yml"
      - "Caddyfile"
      - ".env.example"
      - ".github/workflows/go.yml"

defaults:
  run:
    working-directory: veil-server

jobs:
  configuration:
    name: Container and deployment configuration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate migration runner syntax
        run: sh -n scripts/apply-migrations.sh

      - name: Validate development Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Validate production Compose
        run: docker compose -f deploy/compose.prod.yml --env-file deploy/.env.example config --quiet

      - name: Build gateway container
        run: docker build --tag veil-gateway:ci veil-server

  build:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: veil-server/go.sum

      - name: Download deps
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1

      - name: Staticcheck
        run: staticcheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build, configuration]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: veil_test
          POSTGRES_USER: veil
          POSTGRES_PASSWORD: veiltest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veil"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: veil-server/go.sum

      - name: Run tests
        env:
          DATABASE_URL: postgres://veil:veiltest@localhost:5432/veil_test?sslmode=disable
        run: go test -v -race -timeout 60s ./...

  # End-to-end REST tests against an ephemeral Postgres container spun up
  # via testcontainers-go. Gated by the `integration` build tag so that the
  # default `go test ./...` job above stays Docker-free.
  integration:
    name: Integration (testcontainers)
    runs-on: ubuntu-latest
    needs: [build, configuration]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: veil-server/go.sum

      - name: Verify Docker is available
        run: docker info

      - name: Run integration tests
        env:
          # testcontainers-go reuses containers across tests when ryuk is
          # disabled; on CI we want clean teardown.
          TESTCONTAINERS_RYUK_DISABLED: "false"
        run: go test -tags=integration -timeout 5m -v ./internal/integration/...
