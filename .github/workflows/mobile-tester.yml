name: Android Tester APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Positive Android tester versionCode
        required: true
        type: string
      version_name:
        description: Android tester versionName, for example 0.1.0-tester.20260720.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-signed-tester-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tester:
    name: Build and verify signed tester APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: android-tester
    env:
      ANDROID_NDK_VERSION: 27.1.12297006
      CARGO_NDK_VERSION: 4.1.2
      CARGO_TERM_COLOR: always
      NODE_ENV: development
      VEIL_SOURCE_COMMIT: ${{ github.sha }}
      VEIL_ANDROID_TESTER_VERSION_CODE: ${{ inputs.version_code }}
      VEIL_ANDROID_TESTER_VERSION_NAME: ${{ inputs.version_name }}
      VEIL_ANDROID_TESTER_CERT_SHA256: ${{ secrets.VEIL_ANDROID_TESTER_CERT_SHA256 || vars.VEIL_ANDROID_TESTER_CERT_SHA256 }}
      VEIL_ANDROID_PRODUCTION_CERT_SHA256: ${{ secrets.VEIL_ANDROID_PRODUCTION_CERT_SHA256 || vars.VEIL_ANDROID_PRODUCTION_CERT_SHA256 }}
    steps:
      - name: Check out requested source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate manual inputs and protected tester configuration
        shell: bash
        env:
          VEIL_ANDROID_TESTER_KEYSTORE_BASE64: ${{ secrets.VEIL_ANDROID_TESTER_KEYSTORE_BASE64 }}
          VEIL_ANDROID_TESTER_KEYSTORE_PASSWORD: ${{ secrets.VEIL_ANDROID_TESTER_KEYSTORE_PASSWORD }}
          VEIL_ANDROID_TESTER_KEY_ALIAS: ${{ secrets.VEIL_ANDROID_TESTER_KEY_ALIAS }}
          VEIL_ANDROID_TESTER_KEY_PASSWORD: ${{ secrets.VEIL_ANDROID_TESTER_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing_names=()
          [[ -n "${VEIL_ANDROID_TESTER_KEYSTORE_BASE64:-}" ]] || missing_names+=(VEIL_ANDROID_TESTER_KEYSTORE_BASE64)
          [[ -n "${VEIL_ANDROID_TESTER_KEYSTORE_PASSWORD:-}" ]] || missing_names+=(VEIL_ANDROID_TESTER_KEYSTORE_PASSWORD)
          [[ -n "${VEIL_ANDROID_TESTER_KEY_ALIAS:-}" ]] || missing_names+=(VEIL_ANDROID_TESTER_KEY_ALIAS)
          [[ -n "${VEIL_ANDROID_TESTER_KEY_PASSWORD:-}" ]] || missing_names+=(VEIL_ANDROID_TESTER_KEY_PASSWORD)
          [[ -n "${VEIL_ANDROID_TESTER_CERT_SHA256:-}" ]] || missing_names+=(VEIL_ANDROID_TESTER_CERT_SHA256)
          [[ -n "${VEIL_ANDROID_PRODUCTION_CERT_SHA256:-}" ]] || missing_names+=(VEIL_ANDROID_PRODUCTION_CERT_SHA256)
          if (( ${#missing_names[@]} != 0 )); then
            for required_name in "${missing_names[@]}"; do
              echo "::error title=Missing Android tester configuration::${required_name} is required by the protected android-tester environment."
            done
            exit 1
          fi

          if [[ ! "${VEIL_ANDROID_TESTER_VERSION_CODE}" =~ ^[1-9][0-9]{0,9}$ ]] || \
             (( 10#${VEIL_ANDROID_TESTER_VERSION_CODE} > 2100000000 )); then
            echo "::error title=Invalid tester versionCode::version_code must be a positive decimal no greater than 2100000000."
            exit 1
          fi
          if (( ${#VEIL_ANDROID_TESTER_VERSION_NAME} > 64 )) || \
             [[ ! "${VEIL_ANDROID_TESTER_VERSION_NAME}" =~ ^[0-9]+(\.[0-9]+){2}-tester(\.[0-9A-Za-z][0-9A-Za-z.-]{0,31})?$ ]]; then
            echo "::error title=Invalid tester versionName::Use syntax such as 0.1.0-tester or 0.1.0-tester.20260720.1."
            exit 1
          fi
          if [[ ! "${VEIL_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid source commit::github.sha must be a lowercase 40-character commit id."
            exit 1
          fi
          if [[ ! "${VEIL_ANDROID_TESTER_CERT_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=Invalid tester certificate fingerprint::VEIL_ANDROID_TESTER_CERT_SHA256 must be 64 lowercase hexadecimal characters without separators."
            exit 1
          fi
          if [[ ! "${VEIL_ANDROID_PRODUCTION_CERT_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=Invalid production certificate fingerprint::VEIL_ANDROID_PRODUCTION_CERT_SHA256 must be 64 lowercase hexadecimal characters without separators."
            exit 1
          fi
          if [[ "${VEIL_ANDROID_TESTER_CERT_SHA256}" == "${VEIL_ANDROID_PRODUCTION_CERT_SHA256}" ]]; then
            echo "::error title=Tester signer is not isolated::The tester and production certificate fingerprints must differ."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17.0.15+6"

      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.29.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0
          cache: pnpm
          cache-dependency-path: veil-mobile/pnpm-lock.yaml

      - name: Install locked JavaScript dependencies
        working-directory: veil-mobile
        run: pnpm install --frozen-lockfile

      - name: Verify production JavaScript bundle boundary
        working-directory: veil-mobile
        env:
          NODE_ENV: production
        run: pnpm verify:android-production-bundle

      - name: Test the Android tester APK verifier
        working-directory: veil-mobile
        run: pnpm test:android-tester-apk-verifier

      - name: Set up Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Protocol Buffers compiler
        run: protoc --version

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Verify Android WebSocket TLS policy
        shell: bash
        run: |
          set -euo pipefail
          tls_features="$(cargo tree --locked -p veil-ffi --target aarch64-linux-android -e features)"
          if ! grep -Fq 'tokio-tungstenite feature "rustls-tls-webpki-roots"' <<<"${tls_features}"; then
            echo "Android veil-ffi graph is missing the webpki root store." >&2
            exit 1
          fi
          if grep -Fq 'tokio-tungstenite feature "rustls-tls-native-roots"' <<<"${tls_features}"; then
            echo "Android veil-ffi graph must not use rustls native-root discovery." >&2
            exit 1
          fi
          if ! grep -Fq 'rustls feature "ring"' <<<"${tls_features}"; then
            echo "Android veil-ffi graph is missing the reviewed rustls ring provider." >&2
            exit 1
          fi
          if ! grep -Fq 'rustls feature "tls12"' <<<"${tls_features}"; then
            echo "Android veil-ffi graph must keep the reviewed TLS 1.2/1.3 transport contract." >&2
            exit 1
          fi
          if grep -Fq 'rustls feature "aws_lc_rs"' <<<"${tls_features}"; then
            echo "Android veil-ffi graph must not compile an unreviewed second rustls provider." >&2
            exit 1
          fi

      - name: Install native build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libdbus-1-dev \
            libsecret-1-dev \
            libssl-dev \
            perl \
            pkg-config

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923"
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android SDK and NDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --locked --version "${CARGO_NDK_VERSION}"

      - name: Build Rust libraries and regenerate UniFFI bindings
        shell: pwsh
        env:
          VEIL_IDENTITY_TRANSPARENCY_WITNESS_KEYS: ${{ vars.VEIL_IDENTITY_TRANSPARENCY_WITNESS_KEYS }}
          VEIL_IDENTITY_TRANSPARENCY_WITNESS_QUORUM: ${{ vars.VEIL_IDENTITY_TRANSPARENCY_WITNESS_QUORUM }}
        run: |
          & ./veil-mobile/scripts/build-android-native.ps1 `
            -CargoTargetDir (Join-Path $env:RUNNER_TEMP "veil-mobile-tester-rust-target")

      - name: Verify generated UniFFI bindings are current
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=all -- veil-mobile/src/native/generated)" ]]; then
            git diff -- veil-mobile/src/native/generated
            git status --short --untracked-files=all -- veil-mobile/src/native/generated
            echo "UniFFI Kotlin bindings are stale. Regenerate and commit them." >&2
            exit 1
          fi

      - name: Verify production UniFFI surface
        working-directory: veil-mobile
        run: pnpm verify:uniffi-production-surface

      - name: Test and lint release-like tester policy
        working-directory: veil-mobile/android
        shell: bash
        env:
          NODE_ENV: production
        run: >-
          bash ./gradlew
          --no-daemon
          :app:testReleaseUnitTest
          :app:testInternalTesterUnitTest
          :app:lintInternalTester
          -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Decode protected tester keystore
        shell: bash
        env:
          VEIL_ANDROID_TESTER_KEYSTORE_BASE64: ${{ secrets.VEIL_ANDROID_TESTER_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${VEIL_ANDROID_TESTER_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/veil-android-tester.keystore.part"
          test -s "${RUNNER_TEMP}/veil-android-tester.keystore.part"
          mv "${RUNNER_TEMP}/veil-android-tester.keystore.part" "${RUNNER_TEMP}/veil-android-tester.keystore"

      - name: Assemble signed tester APK
        working-directory: veil-mobile/android
        shell: bash
        env:
          NODE_ENV: production
          VEIL_ANDROID_TESTER_KEYSTORE: ${{ runner.temp }}/veil-android-tester.keystore
          VEIL_ANDROID_TESTER_KEYSTORE_PASSWORD: ${{ secrets.VEIL_ANDROID_TESTER_KEYSTORE_PASSWORD }}
          VEIL_ANDROID_TESTER_KEY_ALIAS: ${{ secrets.VEIL_ANDROID_TESTER_KEY_ALIAS }}
          VEIL_ANDROID_TESTER_KEY_PASSWORD: ${{ secrets.VEIL_ANDROID_TESTER_KEY_PASSWORD }}
        run: >-
          bash ./gradlew
          --no-daemon
          :app:assembleInternalTester
          -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Remove decoded tester keystore
        if: always()
        shell: bash
        run: rm -f -- "${RUNNER_TEMP}/veil-android-tester.keystore" "${RUNNER_TEMP}/veil-android-tester.keystore.part"

      - name: Verify signed tester APK and write sanitized evidence
        if: success()
        working-directory: veil-mobile
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/apk/internalTester/app-internalTester.apk
          test -f android/app/src/main/jniLibs/arm64-v8a/libveil_ffi.so
          test -f android/app/src/main/jniLibs/x86_64/libveil_ffi.so
          pnpm verify:android-tester-apk -- \
            --apk android/app/build/outputs/apk/internalTester/app-internalTester.apk \
            --expected-cert-sha256 "${VEIL_ANDROID_TESTER_CERT_SHA256}" \
            --forbidden-cert-sha256 "${VEIL_ANDROID_PRODUCTION_CERT_SHA256}" \
            --expected-version-code "${VEIL_ANDROID_TESTER_VERSION_CODE}" \
            --expected-version-name "${VEIL_ANDROID_TESTER_VERSION_NAME}" \
            --expected-source-commit "${VEIL_SOURCE_COMMIT}" \
            --evidence-out "${RUNNER_TEMP}/veil-android-tester-evidence.json" \
            --android-sdk "${ANDROID_SDK_ROOT}"

      - name: Upload signed tester APK and sanitized evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veil-mobile-signed-tester-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            veil-mobile/android/app/build/outputs/apk/internalTester/app-internalTester.apk
            ${{ runner.temp }}/veil-android-tester-evidence.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
