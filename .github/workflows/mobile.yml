name: Mobile CI

on:
  push:
    branches: [master, main]
    paths:
      - "veil-mobile/**"
      - "veil-ffi/**"
      - "veil-client/**"
      - "veil-crypto/**"
      - "veil-store/**"
      - "veil-search/**"
      - "veil-proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "veil-mobile/**"
      - "veil-ffi/**"
      - "veil-client/**"
      - "veil-crypto/**"
      - "veil-store/**"
      - "veil-search/**"
      - "veil-proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veil-mobile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: veil-mobile/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test --runInBand

  android-native:
    name: Native Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_NDK_VERSION: 27.1.12297006
      CARGO_NDK_VERSION: 4.1.2
      CARGO_TERM_COLOR: always
      NODE_ENV: development
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.29.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: veil-mobile/pnpm-lock.yaml

      - name: Install locked JavaScript dependencies
        working-directory: veil-mobile
        run: pnpm install --frozen-lockfile

      - name: Set up Protocol Buffers compiler
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install native build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libdbus-1-dev \
            libsecret-1-dev \
            libssl-dev \
            perl \
            pkg-config

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923"
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android SDK and NDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --locked --version "${CARGO_NDK_VERSION}"

      - name: Build Rust libraries and regenerate UniFFI bindings
        shell: pwsh
        run: |
          & ./veil-mobile/scripts/build-android-native.ps1 `
            -CargoTargetDir (Join-Path $env:RUNNER_TEMP "veil-mobile-rust-target")

      - name: Verify generated UniFFI bindings are current
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- veil-mobile/src/native/generated)" ]]; then
            git diff -- veil-mobile/src/native/generated
            git status --short --untracked-files=all -- veil-mobile/src/native/generated
            echo "UniFFI Kotlin bindings are stale. Regenerate and commit them." >&2
            exit 1
          fi

      - name: Run native Android unit tests
        working-directory: veil-mobile/android
        shell: bash
        run: >-
          bash ./gradlew
          --no-daemon
          --stacktrace
          :app:testDebugUnitTest
          -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Assemble debug CI APK
        working-directory: veil-mobile/android
        shell: bash
        run: >-
          bash ./gradlew
          --no-daemon
          --stacktrace
          :app:assembleDebug
          -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Verify APK and Rust ABI payloads
        shell: bash
        run: |
          test -f veil-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -f veil-mobile/android/app/src/main/jniLibs/arm64-v8a/libveil_ffi.so
          test -f veil-mobile/android/app/src/main/jniLibs/x86_64/libveil_ffi.so

      - name: Upload debug APK as short-lived CI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veil-mobile-debug-ci
          path: veil-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
