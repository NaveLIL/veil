name: Desktop UI CI

on:
  push:
    branches: [master, main, "ds/beta-all-2026-07-21"]
    paths:
      - "veil-desktop/src/**"
      - "veil-desktop/index.html"
      - "veil-desktop/package.json"
      - "veil-desktop/pnpm-lock.yaml"
      - "veil-desktop/tsconfig.json"
      - "veil-desktop/vite.config.ts"
      - "veil-desktop/vitest.config.ts"
      - "veil-desktop/playwright.config.ts"
      - "veil-desktop/visual.html"
      - "veil-desktop/visual-tests/**"
      - "veil-desktop/public/visual/**"
      - "veil-server/cmd/gateway/web/index.html"
      - ".github/workflows/desktop-ui.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "veil-desktop/src/**"
      - "veil-desktop/index.html"
      - "veil-desktop/package.json"
      - "veil-desktop/pnpm-lock.yaml"
      - "veil-desktop/tsconfig.json"
      - "veil-desktop/vite.config.ts"
      - "veil-desktop/vitest.config.ts"
      - "veil-desktop/playwright.config.ts"
      - "veil-desktop/visual.html"
      - "veil-desktop/visual-tests/**"
      - "veil-desktop/public/visual/**"
      - "veil-server/cmd/gateway/web/index.html"
      - ".github/workflows/desktop-ui.yml"

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, unit and accessibility smoke
    runs-on: ubuntu-latest
    # Match the packaged renderer environment so PR CI catches tests that
    # accidentally depend on the development loopback default.
    env:
      VITE_VEIL_WS_URL: wss://veil.erez.pro/v3/events
      VITE_VEIL_HTTP_URL: https://veil.erez.pro
    defaults:
      run:
        working-directory: veil-desktop
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: veil-desktop/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run component and accessibility tests
        run: pnpm test:run
      - name: Build production renderer
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run AppShell visual regression matrix
        run: pnpm test:visual
