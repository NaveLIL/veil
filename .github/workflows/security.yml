name: Security Audit

on:
  push:
    branches: [master, main, "ds/beta-all-2026-07-21"]
  pull_request:
    branches: [master, main]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-ssh-helper:
    name: Release SSH Helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Test strict release SSH preparation
        shell: bash
        run: bash scripts/tests/prepare-release-ssh.test.sh

  cargo-audit:
    name: Cargo Audit (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run cargo audit
        # Tauri's Linux WebKitGTK stack still pins glib 0.18.5. The advisory is
        # limited to VariantStrIter methods Veil does not call and cannot be
        # upgraded independently of the Tauri runtime. Keep that single,
        # reviewed exception explicit while making every new unsound advisory
        # a hard failure.
        run: cargo audit --deny unsound --ignore RUSTSEC-2024-0429

  cargo-deny:
    name: Cargo Deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87 # v2
        with:
          command: check bans licenses sources
          arguments: ""

  go-vulnerability-scan:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: veil-server/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan reachable Go code
        working-directory: veil-server
        run: govulncheck ./...

  desktop-audit:
    name: Desktop Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # pnpm 11 uses the supported bulk advisory API while auditing the
      # committed lockfile. Security overrides live in pnpm-workspace.yaml.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Audit dependencies
        working-directory: veil-desktop
        run: pnpm audit --audit-level=low

  mobile-audit:
    name: Mobile Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Keep this aligned with desktop-audit so registry API behavior cannot
      # diverge between the two JavaScript dependency gates.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Audit dependencies
        working-directory: veil-mobile
        # image-size is a Metro build-time parser reached only through the
        # repository-controlled Expo toolchain. Its upstream repository was
        # archived and the advisory's claimed 2.0.3 fix is not published.
        # The workspace auditConfig lists the two exact, time-bounded GHSA
        # exceptions. Every other advisory remains a hard failure here.
        run: pnpm audit --audit-level=low

  third-party-notices:
    name: Third-party Notice Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install pinned Rust license collector
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: veil-server/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: veil-desktop/pnpm-lock.yaml

      - name: Install locked dependencies
        run: |
          pnpm --dir veil-desktop install --frozen-lockfile
          (cd veil-server && go mod download)

      - name: Generate and validate distributable notices
        run: |
          set -euo pipefail
          node scripts/generate-third-party-notices.mjs \
            --component desktop \
            --output "$RUNNER_TEMP/Veil-desktop-THIRD_PARTY_NOTICES.txt"
          node scripts/generate-third-party-notices.mjs \
            --component gateway \
            --output "$RUNNER_TEMP/Veil-gateway-THIRD_PARTY_NOTICES.txt"
          test -s "$RUNNER_TEMP/Veil-desktop-THIRD_PARTY_NOTICES.txt"
          test -s "$RUNNER_TEMP/Veil-gateway-THIRD_PARTY_NOTICES.txt"
          grep -F "VEIL THIRD-PARTY SOFTWARE NOTICES" \
            "$RUNNER_TEMP/Veil-desktop-THIRD_PARTY_NOTICES.txt" \
            "$RUNNER_TEMP/Veil-gateway-THIRD_PARTY_NOTICES.txt"

  # Check that zeroize is used where it should be (advisory)
  zeroize-check:
    name: Zeroize Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check for raw secret patterns without zeroize
        run: |
          echo "=== Checking for potential unzeroized secrets ==="

          # Files that handle secrets must import zeroize
          # signature/chunked_aead/x25519 only borrow keys owned by zeroizing
          # types; public_key validates public material only. Membership and
          # transparency production code encode/verify public keys, hashes,
          # signatures, and public commitments only; their fixed test-vector
          # seeds are synthetic fixtures, never runtime secret ownership.
          # None of these reviewed modules retain raw private material.
          CRYPTO_FILES=$(find veil-crypto/src -name "*.rs" ! -name "lib.rs" ! -name "fingerprint.rs" ! -name "signature.rs" ! -name "chunked_aead.rs" ! -name "x25519.rs" ! -name "public_key.rs" ! -name "membership.rs" ! -name "transparency.rs")
          FAIL=0

          for f in $CRYPTO_FILES; do
            if ! grep -q "use.*zeroize" "$f" && ! grep -q "Zeroize" "$f"; then
              # Check if file actually handles key material
              if grep -qE "(secret|key|seed|entropy)" "$f"; then
                echo "WARNING: $f handles secrets but does not import zeroize"
                FAIL=1
              fi
            fi
          done

          # Ensure no .clone() on types that should not be cloned
          if grep -rn "shared_secret\.clone\|root_key\.clone\|chain_key\.clone" veil-crypto/src/; then
            echo "ERROR: Secret key material is being cloned"
            FAIL=1
          fi

          if [ $FAIL -eq 1 ]; then
            echo "Potential zeroize compliance issues found"
            exit 1
          else
            echo "All checks passed"
          fi
