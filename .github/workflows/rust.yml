name: Rust CI

on:
  push:
    branches: [master, main, "ds/beta-all-2026-07-21"]
    paths:
      - "veil-crypto/**"
      - "veil-store/**"
      - "veil-client/**"
      - "veil-uploads/**"
      - "veil-search/**"
      - "veil-mls/**"
      - "veil-ffi/**"
      - "veil-desktop/src-tauri/**"
      - "veil-share-viewer/**"
      - "veil-proto/**"
      - "test-vectors/**"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "veil-crypto/**"
      - "veil-store/**"
      - "veil-client/**"
      - "veil-uploads/**"
      - "veil-search/**"
      - "veil-mls/**"
      - "veil-ffi/**"
      - "veil-desktop/src-tauri/**"
      - "veil-share-viewer/**"
      - "veil-proto/**"
      - "test-vectors/**"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pinned Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Protocol Buffers compiler
        run: protoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libsecret-1-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all targets, Linux)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (all targets, macOS — exclude desktop)
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --exclude veil-desktop --all-targets -- -D warnings

      - name: Build workspace (Linux)
        if: runner.os == 'Linux'
        run: cargo build --workspace

      - name: Clippy (all targets, Windows)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace (macOS — exclude desktop)
        if: runner.os == 'macOS'
        run: cargo build --workspace --exclude veil-desktop

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace -- --nocapture
        env:
          RUST_BACKTRACE: 1

      - name: Build workspace (Windows)
        if: runner.os == 'Windows'
        run: cargo build --workspace

      - name: Run tests (macOS — exclude desktop)
        if: runner.os == 'macOS'
        run: cargo test --workspace --exclude veil-desktop -- --nocapture
        env:
          RUST_BACKTRACE: 1

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace -- --nocapture
        env:
          RUST_BACKTRACE: 1

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: wasm-cargo-${{ hashFiles('veil-share-viewer/Cargo.toml', 'veil-crypto/Cargo.toml') }}

      - name: Build share-viewer for WASM
        run: cargo build -p veil-share-viewer --target wasm32-unknown-unknown --release

  bench:
    name: Benchmarks (check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Build benchmarks (no run)
        run: cargo bench -p veil-crypto --no-run
