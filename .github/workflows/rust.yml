name: Rust CI

on:
  push:
    branches: [master, main]
    paths:
      - "veil-crypto/**"
      - "veil-store/**"
      - "veil-client/**"
      - "veil-uploads/**"
      - "veil-search/**"
      - "veil-mls/**"
      - "veil-ffi/**"
      - "veil-desktop/src-tauri/**"
      - "veil-share-viewer/**"
      - "veil-proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "veil-crypto/**"
      - "veil-store/**"
      - "veil-client/**"
      - "veil-uploads/**"
      - "veil-search/**"
      - "veil-mls/**"
      - "veil-ffi/**"
      - "veil-desktop/src-tauri/**"
      - "veil-share-viewer/**"
      - "veil-proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libsecret-1-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            protobuf-compiler
          protoc --version

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          protoc --version

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) {
            choco install protoc --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          protoc --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all targets, Linux)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (all targets, macOS — exclude desktop)
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --exclude veil-desktop --all-targets -- -D warnings

      - name: Build workspace (Linux)
        if: runner.os == 'Linux'
        run: cargo build --workspace

      - name: Clippy (all targets, Windows)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace (macOS — exclude desktop)
        if: runner.os == 'macOS'
        run: cargo build --workspace --exclude veil-desktop

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace -- --nocapture
        env:
          RUST_BACKTRACE: 1

      - name: Build workspace (Windows)
        if: runner.os == 'Windows'
        run: cargo build --workspace

      - name: Run tests (macOS — exclude desktop)
        if: runner.os == 'macOS'
        run: cargo test --workspace --exclude veil-desktop -- --nocapture
        env:
          RUST_BACKTRACE: 1

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace -- --nocapture
        env:
          RUST_BACKTRACE: 1

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: wasm-cargo-${{ hashFiles('veil-share-viewer/Cargo.toml', 'veil-crypto/Cargo.toml') }}

      - name: Build share-viewer for WASM
        run: cargo build -p veil-share-viewer --target wasm32-unknown-unknown --release

  bench:
    name: Benchmarks (check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Build benchmarks (no run)
        run: cargo bench -p veil-crypto --no-run
