name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VITE_VEIL_WS_URL: wss://veil.erez.pro/v3/events
  VITE_VEIL_HTTP_URL: https://veil.erez.pro
  VEIL_PROJECT_SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
  VEIL_RELEASE_PUBLISHER: NaveLIL

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test release SSH preparation
        shell: bash
        run: bash scripts/tests/prepare-release-ssh.test.sh

      - name: Parse stable semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag in the form vMAJOR.MINOR.PATCH; got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Require the current default branch and aligned versions
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if [[ "$GITHUB_SHA" != "$(git rev-parse "origin/$DEFAULT_BRANCH")" ]]; then
            echo "Release tag must point to the current tip of $DEFAULT_BRANCH" >&2
            exit 1
          fi

          package_version="$(jq -r .version veil-desktop/package.json)"
          tauri_version="$(jq -r .version veil-desktop/src-tauri/tauri.conf.json)"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' veil-desktop/src-tauri/Cargo.toml | head -n 1)"
          client_version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' veil-client/Cargo.toml | head -n 1)"
          bundle_publisher="$(jq -r .bundle.publisher veil-desktop/src-tauri/tauri.conf.json)"
          for actual in "$package_version" "$tauri_version" "$cargo_version" "$client_version"; do
            if [[ "$actual" != "$version" ]]; then
              echo "Tag version $version does not match desktop version $actual" >&2
              exit 1
            fi
          done
          if [[ "$bundle_publisher" != "$VEIL_RELEASE_PUBLISHER" ]]; then
            echo "Unexpected bundle publisher: $bundle_publisher" >&2
            exit 1
          fi

  vps-preflight:
    name: VPS release sync preflight
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate pinned SSH access and release directory
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh_directory="$(mktemp -d "$RUNNER_TEMP/veil-release-ssh.XXXXXX")"
          cleanup() {
            rm -rf -- "$ssh_directory"
          }
          trap cleanup EXIT

          bash scripts/prepare-release-ssh.sh "$ssh_directory"
          ssh -F "$ssh_directory/config" veil-release \
            "set -eu; test -d /srv/veil/releases; test -r /srv/veil/releases; test -w /srv/veil/releases; test -x /srv/veil/releases; command -v tar sha256sum ln mv >/dev/null"
          echo "VPS release sync preflight passed."

  quality:
    name: Release quality gate
    needs: [validate, vps-preflight]
    runs-on: ubuntu-22.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libsecret-1-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            pkg-config

      - name: Set up pinned Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Protocol Buffers compiler
        run: protoc --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: release-quality-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: veil-server/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: veil-desktop/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        working-directory: veil-desktop
        run: pnpm install --frozen-lockfile

      - name: Check and test Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace -- --nocapture

      - name: Check and test Go server
        working-directory: veil-server
        run: |
          go vet ./...
          go test ./...

      - name: Test desktop UI
        working-directory: veil-desktop
        run: pnpm test:run

  linux:
    name: Linux (.deb + AppImage)
    needs: [validate, quality]
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libsecret-1-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            wget

      - name: Set up pinned Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Protocol Buffers compiler
        run: protoc --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install pinned Rust license collector
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: veil-desktop/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        working-directory: veil-desktop
        run: pnpm install --frozen-lockfile

      - name: Generate release-only Tauri config
        working-directory: veil-desktop
        shell: bash
        run: |
          set -euo pipefail
          jq --arg version "$RELEASE_VERSION" \
            '.version = $version' \
            src-tauri/tauri.conf.json > src-tauri/tauri.release.conf.json

      - name: Build Linux packages
        working-directory: veil-desktop
        run: pnpm tauri build --ci --bundles "deb,appimage" --config src-tauri/tauri.release.conf.json

      - name: Normalize Linux asset names
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t debs < <(find "$CARGO_TARGET_DIR/release/bundle/deb" -maxdepth 1 -type f -name '*.deb' -print)
          mapfile -t appimages < <(find "$CARGO_TARGET_DIR/release/bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' -print)
          if [[ ${#debs[@]} -ne 1 ]]; then
            echo "Expected exactly one .deb, found ${#debs[@]}" >&2
            exit 1
          fi
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "Expected exactly one AppImage, found ${#appimages[@]}" >&2
            exit 1
          fi

          deb_version="$(dpkg-deb -f "${debs[0]}" Version)"
          deb_arch="$(dpkg-deb -f "${debs[0]}" Architecture)"
          deb_depends="$(dpkg-deb -f "${debs[0]}" Depends)"
          deb_package="$(dpkg-deb -f "${debs[0]}" Package)"
          deb_maintainer="$(dpkg-deb -f "${debs[0]}" Maintainer)"
          if [[ "$deb_version" != "$RELEASE_VERSION" ]]; then
            echo "Debian package version $deb_version does not match release $RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ "$deb_arch" != "amd64" || -z "$deb_depends" ]]; then
            echo "Unexpected Debian metadata: architecture=$deb_arch depends=$deb_depends" >&2
            exit 1
          fi
          if [[ "$deb_maintainer" != "$VEIL_RELEASE_PUBLISHER" ]]; then
            echo "Unexpected Debian Maintainer: $deb_maintainer" >&2
            exit 1
          fi
          sudo apt-get install -y "${debs[0]}"
          installed_version="$(dpkg-query -W -f='${Version}' "$deb_package")"
          if [[ "$installed_version" != "$RELEASE_VERSION" ]]; then
            echo "Installed Debian package version $installed_version does not match $RELEASE_VERSION" >&2
            exit 1
          fi
          if ! file -b "${appimages[0]}" | grep -Eq 'ELF 64-bit.*x86-64'; then
            echo "AppImage is not an x86-64 ELF executable" >&2
            file "${appimages[0]}" >&2
            exit 1
          fi
          chmod +x "${appimages[0]}"
          "${appimages[0]}" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          checked_elfs=0
          while IFS= read -r binary; do
            if file -b "$binary" | grep -q '^ELF '; then
              ldd_output="$(ldd "$binary" 2>&1 || true)"
              printf '%s\n' "$ldd_output"
              if grep -q 'not found' <<< "$ldd_output"; then
                echo "Unresolved AppImage dependency in $binary" >&2
                exit 1
              fi
              checked_elfs=$((checked_elfs + 1))
            fi
          done < <(find squashfs-root/usr/bin -maxdepth 1 -type f -perm -u+x -print)
          if [[ "$checked_elfs" -eq 0 ]]; then
            echo "No executable ELF payload found in AppImage" >&2
            exit 1
          fi

          install -D -m 0644 "${debs[0]}" release-assets/Veil-linux-amd64.deb
          install -D -m 0755 "${appimages[0]}" release-assets/Veil-linux-x86_64.AppImage
          install -D -m 0644 \
            veil-desktop/src-tauri/resources/THIRD_PARTY_NOTICES.txt \
            release-assets/Veil-linux-THIRD_PARTY_NOTICES.txt

      - name: Upload Linux release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veil-linux-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows Preview (NSIS + MSI)
    needs: [validate, quality]
    runs-on: windows-2022
    outputs:
      signing_mode: ${{ steps.signing_mode.outputs.mode }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Windows signing mode
        id: signing_mode
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          REQUIRE_WINDOWS_SIGNING: ${{ vars.VEIL_REQUIRE_WINDOWS_SIGNING }}
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasPfx -xor $hasPassword) {
            throw "Both Windows signing secrets must be set, or neither"
          }

          $requireSigning = ([string]$env:REQUIRE_WINDOWS_SIGNING).Trim().ToLowerInvariant()
          if ($requireSigning -notin @("", "false", "true")) {
            throw "VEIL_REQUIRE_WINDOWS_SIGNING must be true or false"
          }
          if ($requireSigning -eq "true" -and -not ($hasPfx -and $hasPassword)) {
            throw "Windows signing is required but signing credentials are absent"
          }

          $mode = if ($hasPfx -and $hasPassword) { "authenticode" } else { "unsigned" }
          if ($mode -eq "unsigned") {
            Write-Warning "Publishing unsigned Windows Preview installers; SmartScreen may warn or block"
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT

      - name: Set up pinned Protocol Buffers compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Protocol Buffers compiler
        run: protoc --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install pinned Rust license collector
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: veil-desktop/pnpm-lock.yaml

      - name: Import Authenticode certificate
        id: certificate
        if: ${{ steps.signing_mode.outputs.mode == 'authenticode' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "veil-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $cert = $imported | Where-Object HasPrivateKey | Select-Object -First 1
            if ($null -eq $cert) { throw "Imported certificate has no private key" }
            "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Generate release-only Tauri config
        working-directory: veil-desktop
        shell: pwsh
        env:
          WINDOWS_SIGNING_MODE: ${{ steps.signing_mode.outputs.mode }}
          CERT_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          $config = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $config.version = $env:RELEASE_VERSION
          if ($null -eq $config.bundle.windows) {
            $config.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{})
          }
          foreach ($property in @("certificateThumbprint", "digestAlgorithm", "timestampUrl", "tsp", "signCommand")) {
            $config.bundle.windows.PSObject.Properties.Remove($property)
          }
          if ($env:WINDOWS_SIGNING_MODE -eq "authenticode") {
            if ([string]::IsNullOrWhiteSpace($env:CERT_THUMBPRINT)) {
              throw "The signing certificate thumbprint is unavailable"
            }
            $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $env:CERT_THUMBPRINT -Force
            $config.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue "sha256" -Force
            $config.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue "http://timestamp.digicert.com" -Force
            $config.bundle.windows | Add-Member -NotePropertyName tsp -NotePropertyValue $true -Force
          }
          $config | ConvertTo-Json -Depth 100 | Set-Content src-tauri\tauri.release.conf.json -Encoding utf8

      - name: Install locked frontend dependencies
        working-directory: veil-desktop
        run: pnpm install --frozen-lockfile

      - name: Build Windows installers
        working-directory: veil-desktop
        run: pnpm tauri build --ci --bundles "nsis,msi" --config src-tauri/tauri.release.conf.json

      - name: Verify Windows artifacts and normalize asset names
        shell: pwsh
        env:
          WINDOWS_SIGNING_MODE: ${{ steps.signing_mode.outputs.mode }}
        run: |
          $bundleRoot = Join-Path $env:CARGO_TARGET_DIR "release\bundle"
          $nsis = @(Get-ChildItem (Join-Path $bundleRoot "nsis") -Filter *.exe -File)
          $msi = @(Get-ChildItem (Join-Path $bundleRoot "msi") -Filter *.msi -File)
          if ($nsis.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($nsis.Count)" }
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI installer, found $($msi.Count)" }
          $app = Get-Item (Join-Path $env:CARGO_TARGET_DIR "release\veil-desktop.exe")
          $record = $null
          $view = $null
          $database = $null
          $installer = New-Object -ComObject WindowsInstaller.Installer
          try {
            $database = $installer.GetType().InvokeMember(
              "OpenDatabase",
              [Reflection.BindingFlags]::InvokeMethod,
              $null,
              $installer,
              @($msi[0].FullName, 0)
            )
            $view = $database.GetType().InvokeMember(
              "OpenView",
              [Reflection.BindingFlags]::InvokeMethod,
              $null,
              $database,
              "SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = 'Manufacturer'"
            )
            $view.GetType().InvokeMember("Execute", [Reflection.BindingFlags]::InvokeMethod, $null, $view, $null) | Out-Null
            $record = $view.GetType().InvokeMember("Fetch", [Reflection.BindingFlags]::InvokeMethod, $null, $view, $null)
            if ($null -eq $record) { throw "MSI Manufacturer property is missing" }
            $manufacturer = $record.GetType().InvokeMember(
              "StringData",
              [Reflection.BindingFlags]::GetProperty,
              $null,
              $record,
              1
            )
            if ($manufacturer -ne $env:VEIL_RELEASE_PUBLISHER) {
              throw "Unexpected MSI Manufacturer: $manufacturer"
            }
          } finally {
            foreach ($comObject in @($record, $view, $database, $installer)) {
              if ($null -ne $comObject -and [Runtime.InteropServices.Marshal]::IsComObject($comObject)) {
                [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($comObject)
              }
            }
          }
          $artifacts = @($app, $nsis[0], $msi[0])
          foreach ($artifact in $artifacts) {
            if ($artifact.Length -le 0) { throw "Empty Windows artifact: $($artifact.FullName)" }
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            $expectedStatus = if ($env:WINDOWS_SIGNING_MODE -eq "authenticode") { "Valid" } else { "NotSigned" }
            if ($signature.Status.ToString() -ne $expectedStatus) {
              throw "Unexpected Authenticode status on $($artifact.FullName): expected $expectedStatus, got $($signature.Status)"
            }
            if ($env:WINDOWS_SIGNING_MODE -eq "authenticode" -and $null -eq $signature.TimeStamperCertificate) {
              throw "Missing RFC 3161 timestamp on signed artifact: $($artifact.FullName)"
            }
          }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item -LiteralPath $nsis[0].FullName -Destination release-assets\Veil-windows-x64-setup.exe
          Copy-Item -LiteralPath $msi[0].FullName -Destination release-assets\Veil-windows-x64.msi
          Copy-Item -LiteralPath veil-desktop\src-tauri\resources\THIRD_PARTY_NOTICES.txt -Destination release-assets\Veil-windows-THIRD_PARTY_NOTICES.txt

      - name: Remove imported Authenticode certificate
        if: ${{ always() && steps.signing_mode.outputs.mode == 'authenticode' && steps.certificate.outputs.thumbprint != '' }}
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:CERT_THUMBPRINT" -Force -ErrorAction Stop

      - name: Upload Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veil-windows-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [validate, linux, windows]
    if: >-
      ${{ always()
          && needs.validate.result == 'success'
          && needs.linux.result == 'success'
          && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      WINDOWS_SIGNING_MODE: ${{ needs.windows.outputs.signing_mode }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Linux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: veil-linux-release
          path: release-assets

      - name: Download Windows assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: veil-windows-release
          path: release-assets

      - name: Generate checksums and latest.json
        shell: bash
        run: |
          set -euo pipefail
          source_filename="Veil-${RELEASE_VERSION}-source.tar.gz"
          source_tar="$RUNNER_TEMP/veil-source.tar"
          source_mtime="$(git show -s --format=%ct "$GITHUB_SHA")"
          git archive \
            --format=tar \
            --prefix="veil-${RELEASE_VERSION}/" \
            "$GITHUB_SHA" \
            > "$source_tar"
          tar \
            --append \
            --file="$source_tar" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mode=0644 \
            --mtime="@$source_mtime" \
            --transform="s|^Veil-linux-THIRD_PARTY_NOTICES.txt$|veil-${RELEASE_VERSION}/THIRD_PARTY_NOTICES.txt|" \
            -C release-assets \
            Veil-linux-THIRD_PARTY_NOTICES.txt
          gzip -n -c "$source_tar" > "release-assets/$source_filename"
          tar -tzf "release-assets/$source_filename" \
            | grep -Fx "veil-${RELEASE_VERSION}/THIRD_PARTY_NOTICES.txt"
          cd release-assets

          expected=(
            Veil-linux-amd64.deb
            Veil-linux-x86_64.AppImage
            Veil-linux-THIRD_PARTY_NOTICES.txt
            Veil-windows-x64-setup.exe
            Veil-windows-x64.msi
            Veil-windows-THIRD_PARTY_NOTICES.txt
            "$source_filename"
          )
          if [[ "$WINDOWS_SIGNING_MODE" != "authenticode" && "$WINDOWS_SIGNING_MODE" != "unsigned" ]]; then
            echo "Unexpected Windows signing mode: $WINDOWS_SIGNING_MODE" >&2
            exit 1
          fi
          for filename in "${expected[@]}"; do
            if [[ ! -s "$filename" ]]; then
              echo "Missing or empty release asset: $filename" >&2
              exit 1
            fi
          done

          : > SHA256SUMS
          files='[]'
          notices='[]'
          add_file() {
            local platform="$1"
            local kind="$2"
            local label="$3"
            local filename="$4"
            local signature="${5:-}"
            local size sha
            size="$(stat -c '%s' "$filename")"
            sha="$(sha256sum "$filename" | awk '{print $1}')"
            printf '%s  %s\n' "$sha" "$filename" >> SHA256SUMS
            files="$(
              jq -c \
                --arg platform "$platform" \
                --arg kind "$kind" \
                --arg label "$label" \
                --arg filename "$filename" \
                --arg signature "$signature" \
                --argjson size "$size" \
                --arg sha256 "$sha" \
                '. + [({
                  platform: $platform,
                  kind: $kind,
                  label: $label,
                  filename: $filename,
                  size: $size,
                  sha256: $sha256
                } + (if $signature == "" then {} else {signature: $signature} end))]' <<< "$files"
            )"
          }

          add_notice() {
            local platform="$1"
            local filename="$2"
            local size sha
            size="$(stat -c '%s' "$filename")"
            sha="$(sha256sum "$filename" | awk '{print $1}')"
            printf '%s  %s\n' "$sha" "$filename" >> SHA256SUMS
            notices="$(
              jq -c \
                --arg platform "$platform" \
                --arg filename "$filename" \
                --argjson size "$size" \
                --arg sha256 "$sha" \
                '. + [{
                  platform: $platform,
                  filename: $filename,
                  size: $size,
                  sha256: $sha256
                }]' <<< "$notices"
            )"
          }

          add_file linux deb "Linux Debian/Ubuntu (x86_64)" Veil-linux-amd64.deb
          add_file linux appimage "Linux AppImage (x86_64)" Veil-linux-x86_64.AppImage
          add_notice linux Veil-linux-THIRD_PARTY_NOTICES.txt
          add_file windows exe "Windows installer (x64)" Veil-windows-x64-setup.exe "$WINDOWS_SIGNING_MODE"
          add_file windows msi "Windows MSI (x64)" Veil-windows-x64.msi "$WINDOWS_SIGNING_MODE"
          add_notice windows Veil-windows-THIRD_PARTY_NOTICES.txt

          source_size="$(stat -c '%s' "$source_filename")"
          source_sha256="$(sha256sum "$source_filename" | awk '{print $1}')"
          printf '%s  %s\n' "$source_sha256" "$source_filename" >> SHA256SUMS
          source_url="/downloads/$source_filename"

          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg published_at "$published_at" \
            --arg commit "$GITHUB_SHA" \
            --arg license "AGPL-3.0-or-later" \
            --arg source_filename "$source_filename" \
            --arg source_url "$source_url" \
            --arg source_sha256 "$source_sha256" \
            --argjson source_size "$source_size" \
            --argjson files "$files" \
            --argjson notices "$notices" \
            '{
              version: $version,
              published_at: $published_at,
              commit: $commit,
              license: $license,
              source: {
                filename: $source_filename,
                url: $source_url,
                size: $source_size,
                sha256: $source_sha256
              },
              notices: $notices,
              files: $files
            }' > latest.json

          sha256sum --check SHA256SUMS
          jq --exit-status \
            --arg version "$RELEASE_VERSION" \
            '.version == $version
              and .license == "AGPL-3.0-or-later"
              and (.commit | test("^[0-9a-f]{40}$"))
              and (.source.filename | test("^Veil-[0-9]+\\.[0-9]+\\.[0-9]+-source\\.tar\\.gz$"))
              and (.source.sha256 | test("^[0-9a-f]{64}$"))
              and (.source.size > 0)
              and (.notices | length) == 2
              and all(.notices[];
                (.platform == "linux" or .platform == "windows")
                and (.filename | test("^Veil-(linux|windows)-THIRD_PARTY_NOTICES\\.txt$"))
                and (.sha256 | test("^[0-9a-f]{64}$"))
                and (.size > 0))
              and (.files | length) == 4
              and ([.files[] | select(.platform == "linux")] | length) == 2
              and ([.files[] | select(.platform == "windows")] | length) == 2
              and all(.files[];
                (.sha256 | test("^[0-9a-f]{64}$"))
                and (.size > 0))
              and all(.files[] | select(.platform == "windows");
                .signature == "authenticode" or .signature == "unsigned")' \
            latest.json > /dev/null
          cat SHA256SUMS
          jq . latest.json

      - name: Stage draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            is_draft="$(gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to replace assets on already-published release $tag" >&2
              exit 1
            fi
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --prerelease \
              --latest=false \
              --generate-notes \
              --title "Veil $RELEASE_VERSION Preview"
          fi
          gh release upload "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Atomically sync release assets to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh_directory="$(mktemp -d "$RUNNER_TEMP/veil-release-ssh.XXXXXX")"
          archive="$RUNNER_TEMP/veil-release-assets.tar.gz"
          cleanup() {
            rm -rf -- "$ssh_directory"
            rm -f -- "$archive"
          }
          trap cleanup EXIT

          bash scripts/prepare-release-ssh.sh "$ssh_directory"
          tar -C release-assets -czf "$archive" .

          stage_name="${GITHUB_REF_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_base="/srv/veil/releases"
          remote_stage="$remote_base/.incoming/$stage_name"

          ssh -F "$ssh_directory/config" veil-release \
            "umask 022; mkdir -p '$remote_stage' '$remote_base'"
          scp -F "$ssh_directory/config" "$archive" \
            "veil-release:$remote_stage/release-assets.tar.gz"

          ssh -F "$ssh_directory/config" veil-release \
            "sh -s -- '$stage_name'" <<'REMOTE_SCRIPT'
          set -eu
          stage_name="$1"
          base="/srv/veil/releases"
          stage="$base/.incoming/$stage_name"
          release_name="$stage_name"
          release_dir="$base/$release_name"

          test -f "$stage/release-assets.tar.gz"
          tar -xzf "$stage/release-assets.tar.gz" -C "$stage"
          rm -f "$stage/release-assets.tar.gz"
          test -s "$stage/latest.json"
          (cd "$stage" && sha256sum --check SHA256SUMS)
          test ! -e "$release_dir"
          mv "$stage" "$release_dir"

          current_tmp="$base/.current-$stage_name"
          ln -s "$release_name" "$current_tmp"
          mv -Tf "$current_tmp" "$base/current"
          REMOTE_SCRIPT

          echo "Published $GITHUB_REF_NAME to the pinned VPS release directory."

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease \
            --latest=false
