syntax = "proto3";
package veil.v1;

option go_package = "github.com/NaveLIL/veil/veil-server/pkg/proto/v1";

// Сервер отправляет challenge при подключении
message AuthChallenge {
  bytes challenge = 1;  // 32 bytes random
}

// Клиент подписывает challenge и отправляет identity
message AuthResponse {
  bytes identity_key = 1;    // X25519 public key (32 bytes)
  bytes signing_key = 2;     // Ed25519 public key (32 bytes)
  bytes signature = 3;       // Ed25519 signature of challenge
  bytes device_id = 4;       // Unique device ID (16 bytes UUID)
  string device_name = 5;    // Human-readable: "Pixel 9", "MacBook Pro"
  string client_version = 6; // "veil-desktop/1.0.0"
  DeviceBindingV1 device_binding = 7; // Present only for cryptographic per-device auth.
  bytes device_signature = 8;         // Ed25519 signature over veil-device-auth-v1 preimage.
  // Optional 256-bit Node Access invite. A first-time identity presents it
  // inside the already-established TLS WebSocket after proving possession of
  // its account keys. Existing identities never need an invite.
  bytes node_access_invite = 9;
}

// Результат аутентификации
message AuthResult {
  bool success = 1;
  optional string user_id = 2;
  optional string error_message = 3;
  bool per_device_secure = 4;
  uint64 device_binding_version = 5;
  DeviceBindingStatus device_binding_status = 6;
  AuthFailureReason failure_reason = 7;
}

// Machine-readable authentication outcomes. REGISTRATION_CLOSED and
// INVITE_INVALID are emitted only after account-key proof succeeds, avoiding
// an unauthenticated account/invite oracle. Invalid, expired, and reused
// invites intentionally share one indistinguishable result.
enum AuthFailureReason {
  AUTH_FAILURE_REASON_UNSPECIFIED = 0;
  AUTH_FAILURE_REASON_AUTHENTICATION_FAILED = 1;
  AUTH_FAILURE_REASON_REGISTRATION_CLOSED = 2;
  AUTH_FAILURE_REASON_INVITE_INVALID = 3;
}

// Bit values carried in DeviceBindingV1.capabilities. Values may be ORed.
enum DeviceCapability {
  DEVICE_CAPABILITY_UNSPECIFIED = 0;
  DEVICE_CAPABILITY_SENDER_KEY_V5 = 1;
  DEVICE_CAPABILITY_SEALED_SKDM_V3 = 2;
}

enum DeviceBindingStatus {
  DEVICE_BINDING_STATUS_UNSPECIFIED = 0;
  DEVICE_BINDING_STATUS_ACTIVE = 1;
  DEVICE_BINDING_STATUS_EXCLUDED = 2;
  DEVICE_BINDING_STATUS_REVOKED = 3;
  // Response-only transitional state. It is never a valid signed binding.
  DEVICE_BINDING_STATUS_LEGACY_UNBOUND = 4;
}

// Account-authorized immutable version of one cryptographic device binding.
// device_id is the existing stable 16-byte device identifier. Key replacement
// requires a new device_id; later versions may change only capabilities/status.
message DeviceBindingV1 {
  bytes device_id = 1;           // 16 bytes
  bytes device_identity_key = 2; // X25519 public key, 32 bytes
  bytes device_signing_key = 3;  // Ed25519 public key, 32 bytes
  uint64 version = 4;            // 1..2^63-1; advances exactly by one
  uint64 capabilities = 5;       // DeviceCapability mask; bit 63 is reserved
  DeviceBindingStatus status = 6;
  bytes account_signature = 7;   // Account Ed25519 signature, 64 bytes
}

message DeviceDirectoryEntry {
  string user_id = 1;
  string username = 2;
  bytes device_id = 3;
  optional DeviceBindingV1 binding = 4;
  bool eligible = 5;
  optional string exclusion_reason = 6;
  bytes account_identity_key = 7; // Account X25519 public key, 32 bytes
  bytes account_signing_key = 8;  // Account Ed25519 public key, 32 bytes
}

message ConversationDeviceDirectory {
  string conversation_id = 1;
  uint64 roster_version = 2;
  bytes roster_commitment = 3;
  bool ready = 4;
  optional string reason = 5;
  uint64 required_capabilities = 6;
  repeated string member_user_ids = 7;
  repeated DeviceDirectoryEntry devices = 8;
}

// Регистрация нового устройства (link existing account)
message RegisterDevice {
  bytes identity_key = 1;
  bytes signing_key = 2;
  bytes device_id = 3;
  string device_name = 4;
  // Для привязки к существующему аккаунту:
  optional bytes link_signature = 5;  // Подпись от master device
}

// Dedicated WebSocket auth v3 wire foundation. Appended after every legacy
// declaration so generated descriptor indexes remain stable. The current /ws
// runtime stays on legacy AuthChallenge/AuthResponse/AuthResult and does not
// emit or accept these messages before the separately reviewed activation.
enum WsRegistrationIntentV3 {
  WS_REGISTRATION_INTENT_V3_UNSPECIFIED = 0;
  WS_REGISTRATION_INTENT_V3_EXISTING = 1;
  WS_REGISTRATION_INTENT_V3_OPEN = 2;
  WS_REGISTRATION_INTENT_V3_PASS = 3;
}

message AuthChallengeV3 {
  uint32 protocol_version = 1;       // Must be exactly 3 at the future runtime boundary.
  bytes server_ephemeral = 2;        // X25519 public key, exactly 32 bytes.
  string canonical_node_origin = 3; // Exact configured canonical Node origin.
}

message AuthResponseV3 {
  uint32 protocol_version = 1;          // Must be exactly 3.
  bytes identity_key = 2;               // Account X25519 public key, exactly 32 bytes.
  bytes signing_key = 3;                // Account Ed25519 public key, exactly 32 bytes.
  bytes account_proof_signature = 4;    // Ed25519 signature over the v3 account proof.
  bytes device_id = 5;                  // Stable device identifier, exactly 16 bytes.
  string device_name = 6;
  string client_version = 7;
  DeviceBindingV1 device_binding = 8;   // Required and strictly verified before commitment use.
  bytes device_proof_signature = 9;     // Ed25519 signature over the chained v3 device proof.
  WsRegistrationIntentV3 registration_intent = 10;
  // Raw 32-byte bearer only for PASS intent. The future runtime must clear
  // decoded copies promptly and derive the signed origin-scoped commitment.
  bytes node_access_pass = 11;
}

enum WsAuthFailureReasonV3 {
  WS_AUTH_FAILURE_REASON_V3_UNSPECIFIED = 0;
  WS_AUTH_FAILURE_REASON_V3_AUTHENTICATION_FAILED = 1;
  WS_AUTH_FAILURE_REASON_V3_REGISTRATION_CLOSED = 2;
  WS_AUTH_FAILURE_REASON_V3_NODE_ACCESS_PASS_INVALID = 3;
}

message AuthResultV3 {
  // Canonical success has user_id present, per_device_secure=true, a positive
  // active binding version/status, failure_reason=UNSPECIFIED, and no
  // error_message. Canonical failure has no user_id, per_device_secure=false,
  // binding version 0/status UNSPECIFIED, and one known non-zero reason;
  // error_message is optional untrusted diagnostic text only.
  // REGISTRATION_CLOSED is valid only for the signed OPEN intent and
  // NODE_ACCESS_PASS_INVALID only for the signed PASS intent.
  uint32 protocol_version = 1;       // Must be exactly 3.
  bool success = 2;
  optional string user_id = 3;
  optional string error_message = 4;
  bool per_device_secure = 5;
  uint64 device_binding_version = 6;
  DeviceBindingStatus device_binding_status = 7;
  WsAuthFailureReasonV3 failure_reason = 8;
  string canonical_node_origin = 9; // Exact configured origin for client comparison.
}
