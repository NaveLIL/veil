syntax = "proto3";
package veil.v1;

option go_package = "github.com/NaveLIL/veil/veil-server/pkg/proto/v1";

// ===================== Messages =====================

enum MessageType {
  MESSAGE_TYPE_TEXT = 0;
  MESSAGE_TYPE_IMAGE = 1;
  MESSAGE_TYPE_FILE = 2;
  MESSAGE_TYPE_VOICE_NOTE = 3;
  MESSAGE_TYPE_VIEW_ONCE = 4;
  MESSAGE_TYPE_SYSTEM = 5;
}

// Клиент → сервер: отправка сообщения
message SendMessage {
  string conversation_id = 1;  // UUID (DM, group, channel — один тип)
  bytes ciphertext = 2;        // E2E зашифрованный payload
  bytes header = 3;            // Encrypted ratchet header (для DM)
  MessageType msg_type = 4;
  optional string reply_to_id = 5;
  optional uint32 ttl_seconds = 6;     // Disappearing message TTL
  repeated EncryptedAttachment attachments = 7;

  // Для sealed sender: ciphertext содержит sender info внутри
  bool sealed = 8;

  // Required for Sender-Key group/channel traffic. The gateway accepts the
  // ciphertext only for the exact current ready device roster.
  uint64 roster_version = 9;
  bytes roster_commitment = 10; // SHA-256, 32 bytes
}

message EncryptedAttachment {
  string media_id = 1;       // ID загруженного файла
  bytes encrypted_key = 2;   // Ключ шифрования файла (зашифрован для получателя)
  bytes nonce = 3;
  uint64 size = 4;
  string content_type = 5;   // MIME type (зашифрован? нет — server needs for thumbnails)
}

// Сервер → клиент: подтверждение отправки
message MessageAck {
  string message_id = 1;
  uint64 server_timestamp = 2;
  uint64 ref_seq = 3;
  bytes target_device_id = 4;       // Exact 16-byte device receiving an SKDM
  optional string conversation_id = 5;
  optional uint32 sender_key_generation = 6;
  optional uint64 roster_version = 7;
  optional bytes envelope_commitment = 8; // SHA-256 of the retained SKDM
}

// Сервер → клиент: сообщение доставлено получателю
message MessageDelivered {
  string message_id = 1;
  string conversation_id = 2;
  uint64 timestamp = 3;
}

// Клиент ↔ сервер: отметка о прочтении
message MessageRead {
  string conversation_id = 1;
  string last_read_id = 2;   // ID последнего прочитанного сообщения
  uint64 timestamp = 3;
}

// Клиент → сервер: редактирование сообщения
message EditMessage {
  string message_id = 1;
  string conversation_id = 2;
  bytes new_ciphertext = 3;
  bytes new_header = 4;
}

// Клиент → сервер: удаление сообщения
message DeleteMessage {
  string message_id = 1;
  string conversation_id = 2;
}

// Сервер → клиент: событие о сообщении (новое, edit, delete)
message MessageEvent {
  enum EventType {
    NEW = 0;
    EDITED = 1;
    DELETED = 2;
  }

  EventType event_type = 1;
  string message_id = 2;
  string conversation_id = 3;
  bytes sender_identity_key = 4;
  string sender_username = 5;
  uint64 server_timestamp = 6;

  // Для NEW и EDITED:
  optional bytes ciphertext = 7;
  optional bytes header = 8;
  optional MessageType msg_type = 9;
  optional string reply_to_id = 10;
  optional uint32 ttl_seconds = 11;
  repeated EncryptedAttachment attachments = 12;
  optional bool sealed = 13;

  // Для EDITED — ID оригинального сообщения:
  optional uint64 edit_timestamp = 14;

  // Present for device-routed Sender-Key group/channel traffic.
  uint64 roster_version = 15;
  bytes roster_commitment = 16;
  bytes sender_device_id = 17;
  bytes target_device_id = 18;

  // Persisted security context for NEW group/channel ciphertext. Empty/zero
  // means an explicitly legacy/unknown row, never an inferred downgrade.
  string crypto_profile = 19;        // "sender_key_v5"
  uint64 crypto_era = 20;            // profile-era version, currently 1
  uint64 sender_binding_version = 21;
}

// Клиент → сервер: добавить/убрать реакцию
message ReactionUpdate {
  string message_id = 1;
  string conversation_id = 2;
  string emoji = 3;        // Unicode emoji (e.g. "👍")
  bool add = 4;            // true = add, false = remove
}

// Сервер → клиент: реакция обновлена
message ReactionEvent {
  string message_id = 1;
  string conversation_id = 2;
  string emoji = 3;
  string user_id = 4;
  string username = 5;
  bool add = 6;
}

// ===================== Crypto Key Exchange =====================

// Prekey bundle for X3DH session establishment
message PreKeyBundle {
  bytes identity_key = 1;          // IK (X25519)
  bytes signed_prekey = 2;         // SPK (X25519)
  bytes signed_prekey_signature = 3; // Ed25519 sig of SPK
  uint32 signed_prekey_id = 4;
  optional bytes one_time_prekey = 5; // OPK (X25519), may be absent
  optional uint32 one_time_prekey_id = 6;
}

// Запрос prekey bundle для начала сессии с пользователем
message PreKeyRequest {
  bytes target_identity_key = 1;     // Identity key получателя
  optional bytes target_device_id = 2; // Конкретное устройство (или все)
}

// Распространение Sender Key для группового чата
message SenderKeyDistribution {
  string conversation_id = 1;      // Group/channel ID
  bytes sender_key_message = 2;    // Encrypted sender key для каждого участника
  uint32 generation = 3;           // Key generation counter
  bytes target_identity_key = 4;   // Target account X25519 key (membership locator)
  bytes target_device_id = 5;      // Exact 16-byte recipient device ID
  bytes target_device_identity_key = 6; // Recipient device X25519 key
  bytes sender_device_id = 7;      // Authenticated 16-byte sender device ID
  uint64 roster_version = 8;
  bytes roster_commitment = 9;     // SHA-256, 32 bytes
  uint64 sender_binding_version = 10;
  uint64 target_binding_version = 11;

  // Exact historical account-authorized sender-device binding. Retained SKDM
  // restore includes this proof even after the sender account/device left the
  // conversation, so a recipient can first-install without trusting current
  // directory membership or accepting a compatibility fallback.
  bytes sender_account_identity_key = 12;
  bytes sender_account_signing_key = 13;
  bytes sender_device_identity_key = 14;
  bytes sender_device_signing_key = 15;
  uint64 sender_device_capabilities = 16;
  uint32 sender_device_binding_status = 17;
  bytes sender_account_signature = 18;
}

// Recipient -> server acknowledgement after the exact device installed one
// retained Sender-Key distribution. The immutable stream head is preserved;
// only the matching pending row is collected.
message SenderKeyReceipt {
  string conversation_id = 1;
  bytes owner_device_id = 2;
  bytes target_device_id = 3;
  uint32 generation = 4;
  uint64 roster_version = 5;
  bytes envelope_commitment = 6;
}
