[package]
name = "veil-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "veil_ffi"

[dependencies]
veil-crypto = { path = "../veil-crypto" }
veil-client = { path = "../veil-client" }
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"
serde_json = "1"
url = "2"
uuid = "1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
