[package]
name = "veil-desktop"
version = "0.1.2"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
name = "veil_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-os = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
veil-crypto = { path = "../../veil-crypto" }
veil-store = { path = "../../veil-store" }
veil-client = { path = "../../veil-client" }
veil-search = { path = "../../veil-search" }
veil-uploads = { path = "../../veil-uploads" }
hex = "0.4"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tempfile = "3"
chrono = "0.4"
infer = "0.16"

[dev-dependencies]
ed25519-dalek = "2"
