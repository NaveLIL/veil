# This file is included from nginx's http{} context. Public :443 remains owned
# by the existing stream/SNI router, which forwards veil.erez.pro with PROXY
# protocol to this loopback-only TLS listener.

map $http_upgrade $veil_connection_upgrade {
    default upgrade;
    ''      close;
}

# REST v1 signs the exact HTTP authority. Released desktop builds send the
# default HTTPS authority without a port, while Android's canonical origin
# includes :443. Preserve only those two reviewed legacy spellings; never pass
# an arbitrary client Host through to the gateway.
map $http_host $veil_rest_v1_authority {
    default             '';
    'veil.erez.pro'     'veil.erez.pro';
    'veil.erez.pro:443' 'veil.erez.pro:443';
}

# Deliberately omit query strings and Referer from access logs. Capability
# tokens must never be copied into general-purpose request logs.
log_format veil_privacy '$remote_addr - $time_local '
                        '"$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';

# Reject missing or unexpected TLS names before they can fall through to the
# managed Veil vhost. The public stream router already selects this listener by
# SNI; this loopback default is a second, independent fail-closed boundary.
server {
    listen 127.0.0.1:4443 ssl http2 proxy_protocol default_server;
    server_name _;

    ssl_reject_handshake on;
    return 421;
}

# Keep HTTP-01 renewal available on public port 80. For the first certificate,
# enable an HTTP-only vhost with this challenge location before enabling the TLS
# server below (see deploy/README.md).
server {
    listen 80;
    server_name veil.erez.pro;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://veil.erez.pro$request_uri;
    }
}

server {
    listen 127.0.0.1:4443 ssl http2 proxy_protocol;
    server_name veil.erez.pro;

    # A valid public request may spell the default TLS port explicitly or omit
    # it, but it must never select another hostname. Nginx's normalized $host
    # deliberately handles both HTTP/1.1 Host and HTTP/2 :authority here.
    if ($host != veil.erez.pro) {
        return 421;
    }
    if ($veil_rest_v1_authority = '') {
        return 421;
    }

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    real_ip_recursive off;

    ssl_certificate     /etc/letsencrypt/live/veil.erez.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veil.erez.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VEIL_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/veil.erez.pro.access.log veil_privacy;
    error_log  /var/log/nginx/veil.erez.pro.error.log warn;

    server_tokens off;
    client_max_body_size 2200m;
    client_body_timeout 1h;
    send_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /downloads {
        return 308 /downloads/;
    }

    # Never list the release directory. Ordinary missing files are handled by
    # nginx as 404; byte-range requests are supported by the static file module.
    location = /downloads/ {
        return 404;
    }

    # The landing page requests this manifest with cache disabled. Keep it
    # separate from immutable-ish binaries so a symlink flip is visible at once.
    location = /downloads/latest.json {
        alias /srv/veil/releases/current/latest.json;
        limit_except GET HEAD { deny all; }

        default_type application/json;
        etag on;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location ^~ /downloads/ {
        alias /srv/veil/releases/current/;
        autoindex off;
        limit_except GET HEAD { deny all; }

        default_type application/octet-stream;
        etag on;
        if_modified_since exact;
        add_header Accept-Ranges "bytes" always;
        # Stable filenames point through an atomic `current` symlink. Do not
        # retain an earlier binary after the manifest switches to a new release.
        add_header Cache-Control "no-store" always;
        add_header Content-Disposition "attachment" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_next_upstream off;

        # Temporary REST-v1 compatibility bridge. The map above converts only
        # two exact managed authorities to literal outputs, preserving the
        # bytes signed by released desktop and current Android clients. It is
        # intentionally not a direct $http_host/$host forward.
        proxy_set_header Host $veil_rest_v1_authority;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        # Gateway intentionally accepts one canonical address, not a
        # comma-separated forwarding chain.
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $veil_rest_v1_authority;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $veil_connection_upgrade;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 5s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }
}
