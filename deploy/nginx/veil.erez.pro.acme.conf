# Temporary HTTP-only vhost for the first Let's Encrypt certificate. Replace
# this file with veil.erez.pro.conf after certbot has created the certificate.
server {
    listen 80;
    server_name veil.erez.pro;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://veil.erez.pro$request_uri;
    }
}
