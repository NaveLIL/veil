[package]
name = "veil-crypto"
version = "0.1.0"
edition = "2021"
authors.workspace = true
description = "Cryptographic core for Veil messenger — X25519, Ed25519, XChaCha20-Poly1305, Double Ratchet, X3DH"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
# Key exchange
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }

# Signatures
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
curve25519-dalek = "5"

# AEAD (message encryption)
chacha20poly1305 = "0.11"

# Key derivation
hkdf = "0.13"
sha2 = "0.11"
hmac = "0.13"
argon2 = "0.5"

# BIP39 mnemonic
bip39 = { version = "2", features = ["zeroize"] }

# Random number generation
rand = "0.10"
rand_core = "0.10"

# Memory safety
zeroize = { version = "1", features = ["derive"] }

# Serialization (for ratchet state persistence)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base64 encoding
base64 = "0.22"

# Error derive
thiserror = "2"

# Constant-time comparison
subtle = "2"

# Hex encoding for fingerprints
hex = "0.4"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "crypto_bench"
harness = false
