[package]
name = "veil-client"
version = "0.1.2"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Protocol engine for Veil messenger — WebSocket, Protobuf, session management"

[dependencies]
veil-crypto = { path = "../veil-crypto" }
veil-store = { path = "../veil-store" }
veil-search = { path = "../veil-search" }
prost = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3"
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
rand = "0.10"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
sha2 = "0.11"
base64 = "0.22"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

[build-dependencies]
prost-build = "0.14"
